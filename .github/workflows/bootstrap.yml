name: Preparar lançamento do MUTARENA

on:
  push:
    branches:
      - lua
    paths:
      - '.release/package.part*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruir e validar pacote
        shell: bash
        run: |
          cat .release/package.part* > /tmp/mutarena-release.b64
          base64 --decode /tmp/mutarena-release.b64 > /tmp/mutarena-release.tar.gz
          echo '8fdde969a40efb1b6d3ac3cab1cd24b4ff076a88a26333e76a0b259cc48fc9f4  /tmp/mutarena-release.tar.gz' | sha256sum --check
          mkdir /tmp/mutarena-release
          tar -xzf /tmp/mutarena-release.tar.gz -C /tmp/mutarena-release

      - name: Instalar projeto oficial
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/mutarena-release/. .

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar testes
        run: npm test

      - name: Consolidar código na branch lua
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publica MUTARENA 4.0.0' || exit 0
          git push origin HEAD:lua

      - name: Tentar habilitar GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi

      - name: Solicitar publicação do site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref lua
