name: Publicar MUTARENA

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mutarena-pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Publicar MUTARENA'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: lua
          fetch-depth: 0

      - name: Reconstruir pacote oficial
        shell: bash
        run: |
          cat .release/package.part* > /tmp/mutarena-release.b64
          base64 --decode /tmp/mutarena-release.b64 > /tmp/mutarena-release.tar.gz
          echo '8fdde969a40efb1b6d3ac3cab1cd24b4ff076a88a26333e76a0b259cc48fc9f4  /tmp/mutarena-release.tar.gz' | sha256sum --check
          mkdir /tmp/mutarena-release
          tar -xzf /tmp/mutarena-release.tar.gz -C /tmp/mutarena-release

      - name: Instalar projeto oficial
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/mutarena-release/. .

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar testes
        run: npm test

      - name: Consolidar versão oficial
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publica MUTARENA 4.0.0' || true
          git push origin HEAD:lua

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
