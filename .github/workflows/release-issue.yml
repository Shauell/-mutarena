name: Preparar site MUTARENA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mutarena-release
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: lua
          fetch-depth: 0

      - name: Reconstruir arquivos do jogo
        shell: bash
        run: |
          set -euo pipefail
          arquivos=()
          for parte in 01 02 03 04 05 06 07 08; do
            arquivo=".release/package.part${parte}"
            test -s "$arquivo" || { echo "ERRO: fragmento ausente ou vazio: $arquivo"; exit 1; }
            arquivos+=("$arquivo")
          done

          cat "${arquivos[@]}" | tr -d '\r\n\t ' > /tmp/mutarena-release.b64
          base64 --decode --ignore-garbage /tmp/mutarena-release.b64 > /tmp/mutarena-release.tar.gz
          tar -tzf /tmp/mutarena-release.tar.gz > /dev/null || {
            echo "ERRO: o pacote reconstruído não é um arquivo tar.gz válido."
            exit 1
          }

          rm -rf /tmp/mutarena-site
          mkdir -p /tmp/mutarena-site
          tar -xzf /tmp/mutarena-release.tar.gz -C /tmp/mutarena-site
          test -f /tmp/mutarena-site/index.html || {
            echo "ERRO: index.html não foi encontrado no pacote."
            find /tmp/mutarena-site -maxdepth 3 -type f -print
            exit 1
          }
          touch /tmp/mutarena-site/.nojekyll
          echo "Pacote reconstruído com sucesso."
          find /tmp/mutarena-site -maxdepth 3 -type f -print | sort

      - name: Criar branch gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --orphan gh-pages-temp
          git rm -rf . || true
          cp -a /tmp/mutarena-site/. .
          git add --all
          git commit -m 'Publica MUTARENA 4.0.0'
          git push --force origin HEAD:gh-pages

          echo "Branch gh-pages criada com sucesso."
