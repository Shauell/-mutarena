name: Publicar MUTARENA

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mutarena-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: lua

      - name: Conferir fragmentos do pacote
        shell: bash
        run: |
          set -euo pipefail
          for parte in 01 02 03 04 05 06 07 08; do
            arquivo=".release/package.part${parte}"
            test -s "$arquivo" || { echo "Fragmento ausente ou vazio: $arquivo"; exit 1; }
          done

      - name: Reconstruir pacote oficial
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release/package.part01 \
            .release/package.part02 \
            .release/package.part03 \
            .release/package.part04 \
            .release/package.part05 \
            .release/package.part06 \
            .release/package.part07 \
            .release/package.part08 \
            > /tmp/mutarena-release.b64
          base64 --decode /tmp/mutarena-release.b64 > /tmp/mutarena-release.tar.gz
          echo '8fdde969a40efb1b6d3ac3cab1cd24b4ff076a88a26333e76a0b259cc48fc9f4  /tmp/mutarena-release.tar.gz' | sha256sum --check
          tar -tzf /tmp/mutarena-release.tar.gz > /dev/null
          mkdir -p /tmp/mutarena-release
          tar -xzf /tmp/mutarena-release.tar.gz -C /tmp/mutarena-release

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Executar testes
        working-directory: /tmp/mutarena-release
        run: npm test

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/mutarena-release

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
