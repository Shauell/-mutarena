name: Preparar site MUTARENA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mutarena-release
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: lua
          fetch-depth: 0

      - name: Reconstruir arquivos do jogo
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/mutarena-release.tar.gz
          touch /tmp/mutarena-release.tar.gz

          for parte in 01 02 03 04 05 06; do
            arquivo=".release/package.part${parte}.b64"
            test -s "$arquivo" || { echo "ERRO: parte ausente: $arquivo"; exit 1; }
            base64 --decode "$arquivo" >> /tmp/mutarena-release.tar.gz
          done

          for parte in 07 08; do
            arquivo=".release/package.part${parte}.bin"
            test -s "$arquivo" || { echo "ERRO: parte ausente: $arquivo"; exit 1; }
            cat "$arquivo" >> /tmp/mutarena-release.tar.gz
          done

          echo 'eb059880a8afc0cf25490e8f529a4abcdc7b14fc17559ff729c877921b386a06  /tmp/mutarena-release.tar.gz' | sha256sum --check
          tar -tzf /tmp/mutarena-release.tar.gz > /dev/null

          rm -rf /tmp/mutarena-site
          mkdir -p /tmp/mutarena-site
          tar -xzf /tmp/mutarena-release.tar.gz -C /tmp/mutarena-site
          test -f /tmp/mutarena-site/index.html
          touch /tmp/mutarena-site/.nojekyll

          echo "Pacote íntegro e index.html encontrados."

      - name: Criar branch gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --orphan gh-pages-temp
          git rm -rf . || true
          cp -a /tmp/mutarena-site/. .
          git add --all
          git commit -m 'Publica MUTARENA 4.0.0'
          git push --force origin HEAD:gh-pages

          echo "Branch gh-pages criada com sucesso."
